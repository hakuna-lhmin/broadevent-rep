# wrangler.toml — Cloudflare Worker configuration
name = "broadevent-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
AI_PROVIDER = "codex"     # "codex" | "claude"
AI_MODEL = "gpt-4o"       # override default model
ALLOWED_ORIGIN = ""       # e.g. "https://broadevent.pages.dev"

# Secrets (set via: wrangler secret put OPENAI_API_KEY)
# OPENAI_API_KEY
# CLAUDE_API_KEY
